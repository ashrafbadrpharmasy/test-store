<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        لوحة الطلبات - متجر اختبار
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4fff7;
            color: #173b27;
        }


        header {
            background: #16834b;
            color: white;

            padding: 20px;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }


        .logout-btn,
        .refresh-btn {
            border: none;

            padding: 10px 15px;

            border-radius: 8px;

            cursor: pointer;
        }


        .logout-btn {
            background: white;
            color: #16834b;
        }


        .refresh-btn {
            background: #16834b;
            color: white;
        }


        .container {
            width: 95%;
            max-width: 1400px;

            margin: 25px auto;
        }


        .stats {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 15px;

            margin-bottom: 20px;
        }


        .stat {
            background: white;

            padding: 18px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);

            text-align: center;
        }


        .stat strong {
            display: block;

            color: #16834b;

            font-size: 28px;

            margin-top: 5px;
        }


        .toolbar {
            background: white;

            padding: 18px;

            border-radius: 14px;

            margin-bottom: 20px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        .toolbar input,
        .toolbar select {
            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }


        .orders {
            display: grid;

            gap: 20px;
        }


        .order-card {
            background: white;

            padding: 20px;

            border-radius: 16px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }


        .order-header {
            display: flex;

            justify-content: space-between;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 15px;
        }


        .order-number {
            color: #16834b;

            font-size: 20px;

            font-weight: bold;
        }


        .date {
            color: #777;

            font-size: 14px;
        }


        .info {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 10px;

            margin-bottom: 15px;
        }


        .info-box {
            background: #f7fbf8;

            padding: 12px;

            border-radius: 10px;
        }


        .info-box strong {
            display: block;

            margin-bottom: 5px;
        }


        .status-row {
            display: flex;

            gap: 10px;

            align-items: center;

            flex-wrap: wrap;

            margin-top: 15px;
        }


        .status-row select {
            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 8px;
        }


        .save-btn,
        .proof-btn,
        .whatsapp-btn {
            border: none;

            padding: 11px 15px;

            border-radius: 8px;

            cursor: pointer;

            color: white;

            text-decoration: none;
        }


        .save-btn {
            background: #16834b;
        }


        .proof-btn {
            display: inline-block;

            margin-top: 10px;

            background: #333;
        }


        .whatsapp-btn {
            background: #25D366;
        }


        .empty {
            background: white;

            padding: 40px;

            text-align: center;

            border-radius: 14px;
        }


        .error {
            background: #ffecec;

            color: #a00000;

            padding: 15px;

            border-radius: 10px;
        }

    </style>

</head>


<body>

<header>

    <h1>
        لوحة الموظف
    </h1>

    <button
        class="logout-btn"
        onclick="logout()">

        تسجيل الخروج

    </button>

</header>


<main class="container">


    <section class="stats">

        <div class="stat">
            كل الطلبات
            <strong id="totalCount">0</strong>
        </div>

        <div class="stat">
            قيد المراجعة
            <strong id="pendingCount">0</strong>
        </div>

        <div class="stat">
            تم التأكيد
            <strong id="confirmedCount">0</strong>
        </div>

        <div class="stat">
            جاري التجهيز
            <strong id="preparingCount">0</strong>
        </div>

        <div class="stat">
            تم الشحن
            <strong id="shippedCount">0</strong>
        </div>

        <div class="stat">
            تم التسليم
            <strong id="deliveredCount">0</strong>
        </div>

    </section>


    <section class="toolbar">

        <input
            type="text"
            id="search"
            placeholder="ابحث برقم الطلب أو الاسم أو الهاتف"
            oninput="renderOrders()">


        <select
            id="filterStatus"
            onchange="renderOrders()">

            <option value="all">
                كل الحالات
            </option>

            <option value="pending">
                قيد المراجعة
            </option>

            <option value="confirmed">
                تم التأكيد
            </option>

            <option value="preparing">
                جاري التجهيز
            </option>

            <option value="shipped">
                تم الشحن
            </option>

            <option value="delivered">
                تم التسليم
            </option>

        </select>


        <button
            class="refresh-btn"
            onclick="loadOrders()">

            تحديث الطلبات

        </button>

    </section>


    <p id="loading">
        جاري تحميل الطلبات...
    </p>


    <section
        id="orders"
        class="orders">
    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://uklivylyenatdqbgmcxy.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ntlKWYQvMXlCs_obIEVIIA_-CfxOFTJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let allOrders = [];


/* =========================
   التحقق من الموظف
========================= */

async function checkLogin() {

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (!data.session) {

        window.location.href =
            "/admin/login.html";

        return false;
    }


    return true;
}


/* =========================
   تحميل الطلبات
========================= */

async function loadOrders() {

    if (!await checkLogin()) {
        return;
    }


    const loading =
        document.getElementById(
            "loading"
        );


    loading.innerText =
        "جاري تحميل الطلبات...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        loading.innerText = "";

        document.getElementById(
            "orders"
        ).innerHTML = `
            <div class="error">
                ${error.message}
            </div>
        `;

        return;
    }


    allOrders = data || [];


    updateStats();


    renderOrders();


    loading.innerText =
        `آخر تحديث: ${
            new Date().toLocaleTimeString("ar-EG")
        }`;
}


/* =========================
   الإحصائيات
========================= */

function updateStats() {

    const count =
        status =>
            allOrders.filter(
                order =>
                    order.status === status
            ).length;


    document.getElementById(
        "totalCount"
    ).innerText =
        allOrders.length;


    document.getElementById(
        "pendingCount"
    ).innerText =
        count("pending");


    document.getElementById(
        "confirmedCount"
    ).innerText =
        count("confirmed");


    document.getElementById(
        "preparingCount"
    ).innerText =
        count("preparing");


    document.getElementById(
        "shippedCount"
    ).innerText =
        count("shipped");


    document.getElementById(
        "deliveredCount"
    ).innerText =
        count("delivered");
}


/* =========================
   عرض الطلبات
========================= */

async function renderOrders() {

    const container =
        document.getElementById(
            "orders"
        );


    const search =
        document.getElementById(
            "search"
        ).value
            .trim()
            .toLowerCase();


    const filter =
        document.getElementById(
            "filterStatus"
        ).value;


    let filtered =
        allOrders.filter(
            order => {

                const matchesSearch =
                    !search ||
                    order.order_number
                        .toLowerCase()
                        .includes(search) ||

                    order.customer_name
                        .toLowerCase()
                        .includes(search) ||

                    order.customer_phone
                        .includes(search);


                const matchesStatus =
                    filter === "all" ||
                    order.status === filter;


                return (
                    matchesSearch &&
                    matchesStatus
                );
            }
        );


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                لا توجد طلبات مطابقة.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    for (const order of filtered) {

        let proofButton = "";


        if (order.payment_proof_url) {

            const {
                data,
                error
            } =
                await supabaseClient.storage
                    .from("payment-proofs")
                    .createSignedUrl(
                        order.payment_proof_url,
                        3600
                    );


            if (
                !error &&
                data?.signedUrl
            ) {

                proofButton = `
                    <a
                        class="proof-btn"
                        href="${data.signedUrl}"
                        target="_blank">
                        فتح إثبات الدفع
                    </a>
                `;
            }
        }


        const date =
            new Date(
                order.created_at
            ).toLocaleString(
                "ar-EG"
            );


        const customerPhone =
            order.customer_phone
                .replace(/\D/g, "")
                .replace(/^0/, "20");


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "order-card";


        card.innerHTML = `

            <div class="order-header">

                <div class="order-number">
                    ${order.order_number}
                </div>

                <div class="date">
                    ${date}
                </div>

            </div>


            <div class="info">

                <div class="info-box">
                    <strong>
                        المنتج
                    </strong>
                    ${order.product_name}
                </div>


                <div class="info-box">
                    <strong>
                        السعر
                    </strong>
                    ${order.product_price}
                    جنيه
                </div>


                <div class="info-box">
                    <strong>
                        اسم العميل
                    </strong>
                    ${order.customer_name}
                </div>


                <div class="info-box">
                    <strong>
                        الهاتف
                    </strong>
                    ${order.customer_phone}
                </div>


                <div class="info-box">
                    <strong>
                        العنوان
                    </strong>
                    ${order.customer_address}
                </div>


                <div class="info-box">
                    <strong>
                        الحالة
                    </strong>
                    ${getStatusLabel(order.status)}
                </div>

            </div>


            ${proofButton}


            <div class="status-row">

                <select
                    id="status-${order.id}">

                    ${statusOptions(
                        order.status
                    )}

                </select>


                <button
                    class="save-btn"
                    onclick="updateStatus(${order.id})">

                    حفظ الحالة

                </button>


                <a
                    class="whatsapp-btn"
                    target="_blank"
                    href="https://wa.me/${customerPhone}?text=${encodeURIComponent(
                        "مرحبًا، بخصوص طلبك " +
                        order.order_number
                    )}">

                    مراسلة العميل

                </a>

            </div>
        `;


        container.appendChild(
            card
        );
    }
}


/* =========================
   الحالات
========================= */

function getStatusLabel(status) {

    const labels = {

        pending:
            "قيد المراجعة",

        confirmed:
            "تم التأكيد",

        preparing:
            "جاري التجهيز",

        shipped:
            "تم الشحن",

        delivered:
            "تم التسليم"
    };


    return labels[status] ||
        status;
}


function statusOptions(current) {

    const statuses = [

        ["pending", "قيد المراجعة"],

        ["confirmed", "تم التأكيد"],

        ["preparing", "جاري التجهيز"],

        ["shipped", "تم الشحن"],

        ["delivered", "تم التسليم"]

    ];


    return statuses
        .map(
            ([value, label]) => `
                <option
                    value="${value}"
                    ${
                        value === current
                            ? "selected"
                            : ""
                    }>
                    ${label}
                </option>
            `
        )
        .join("");
}


/* =========================
   تحديث الحالة
========================= */

async function updateStatus(orderId) {

    const select =
        document.getElementById(
            `status-${orderId}`
        );


    const newStatus =
        select.value;


    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({
                status: newStatus
            })
            .eq("id", orderId);


    if (error) {

        console.error(error);

        alert(
            "حصل خطأ:\n\n" +
            error.message
        );

        return;
    }


    await loadOrders();


    alert(
        "تم تحديث حالة الطلب ✅"
    );
}


/* =========================
   تسجيل الخروج
========================= */

async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "/admin/login.html";
}


/* =========================
   تشغيل اللوحة
========================= */

loadOrders();


/* تحديث تلقائي كل 15 ثانية */

setInterval(
    loadOrders,
    15000
);

</script>

</body>
</html>
